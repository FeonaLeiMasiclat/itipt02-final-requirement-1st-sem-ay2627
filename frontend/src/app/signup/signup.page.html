
<ion-content [fullscreen]="true">

  <div class="signup-page">

    <!-- Sign Up Card -->
    <ion-card class="signup-card">

      <div class="signup-heading">
        <h1>Sign Up</h1>
        <p>Provide your credentials.</p>
      </div>

      <ion-card-content>

        <form (ngSubmit)="register()">

          <!-- Full Name -->
          <div class="input-container">
            <ion-icon name="person" class="input-icon"></ion-icon>

            <ion-input
              type="text"
              name="fullName"
              placeholder="Full Name"
              [(ngModel)]="fullName"
              (ionInput)="clearMessages()"
              aria-label="Full name, required"
              required
              autocomplete="name">
            </ion-input>
          </div>

          <!-- Date of Birth -->
          <div class="input-container">
            <ion-icon name="calendar" class="input-icon"></ion-icon>

            <ion-input
              type="date"
              name="dateOfBirth"
              aria-label="Date of birth, required"
              placeholder="Date of Birth"
              [(ngModel)]="dateOfBirth"
              (ionInput)="clearMessages()"
              required>
            </ion-input>
          </div>

          <!-- Address -->
          <div class="input-container">
            <ion-icon name="home" class="input-icon"></ion-icon>

            <ion-input
              type="text"
              name="address"
              placeholder="Address"
              [(ngModel)]="address"
              (ionInput)="clearMessages()"
              aria-label="Address, required"
              required
              autocomplete="street-address">
            </ion-input>
          </div>

          <!-- Email Address -->
          <div class="input-container">
            <ion-icon name="mail-outline" class="input-icon"></ion-icon>

            <ion-input
              type="email"
              name="email"
              placeholder="Email Address"
              [(ngModel)]="email"
              (ionInput)="clearMessages()"
              aria-label="Email address, required"
              required
              autocomplete="email">
            </ion-input>
          </div>

          <!-- Password -->
          <div class="input-container">
            <ion-icon name="lock-closed" class="input-icon"></ion-icon>

            <ion-input
              class="signup-password-field"
              [type]="showPassword() ? 'text' : 'password'"
              name="accountPassword"
              placeholder="Password"
              [(ngModel)]="password"
              (ionInput)="clearMessages()"
              aria-label="Password, required"
              required
              minlength="6"
              autocomplete="off"
              spellcheck="false">
            </ion-input>

            <ion-button
              fill="clear"
              type="button"
              class="password-button"
              (click)="togglePassword()">

              <ion-icon
                [name]="showPassword() ? 'eye' : 'eye-off'">
              </ion-icon>

            </ion-button>
          </div>

          <!-- Error Message -->
          @if (errorMessage()) {
            <p class="error-message" role="alert" aria-live="assertive">
              {{ errorMessage() }}
            </p>
          }

          <!-- Success Message -->
          @if (successMessage()) {
            <p class="success-message">
              {{ successMessage() }}
            </p>
          }

          <!-- Register Button -->
          <ion-button
            expand="block"
            type="submit"
            class="register-button"
            [disabled]="isLoading()">

            <ion-icon
              name="play"
              slot="start">
            </ion-icon>

            @if (isLoading()) {
              REGISTERING...
            } @else {
              REGISTER
            }

          </ion-button>

          <!-- Login Link -->
          <div class="login-text">
            <span>Already Registered?</span>
            <a routerLink="/login">Log in here.</a>
          </div>

        </form>

      </ion-card-content>

    </ion-card>

  </div>

</ion-content>
