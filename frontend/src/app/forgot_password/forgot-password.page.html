
<ion-content [fullscreen]="true">

  <div class="forgot-page">

    <ion-card class="forgot-card">
      <ion-card-content>

        <!-- Heading -->
        <div class="forgot-heading">
          <h1>Forgot Password?</h1>
          <p>Confirm your account</p>
        </div>

        <form (ngSubmit)="sendResetLink()">

          <ion-label class="email-label">
            Email Address
          </ion-label>

          <!-- Email Input -->
          <div class="input-container">

            <ion-icon
              name="mail-outline"
              class="input-icon">
            </ion-icon>

            <ion-input
              type="email"
              name="email"
              placeholder="you@example.com"
              [(ngModel)]="email"
              required
              autocomplete="email">
            </ion-input>

          </div>

          <!-- Error Message -->
          @if (errorMessage()) {
            <p class="error-message">
              {{ errorMessage() }}
            </p>
          }

          <!-- Success Message -->
          @if (successMessage()) {
            <p class="success-message">
              {{ successMessage() }}
            </p>
          }

          <!-- Send Reset Link -->
          <ion-button
            expand="block"
            type="submit"
            class="reset-button"
            [disabled]="isLoading()">

            @if (isLoading()) {
              Sending...
            } @else {
              Send Reset Link
            }

          </ion-button>

        </form>

        <!-- Back Button -->
        <div class="back-button-container">
          <ion-button
            fill="clear"
            class="back-button"
            (click)="goToLogin()">
            Back to Log in
          </ion-button>
        </div>

      </ion-card-content>
    </ion-card>

  </div>

</ion-content>
